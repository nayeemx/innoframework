<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Innology Framework</title>
  <desc>Typed fullstack. Authenticated. Fail-closed.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background disc -->
  <circle cx="100" cy="100" r="92" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.55"/>

  <!-- shield: security boundary -->
  <path d="M100 38 L146 54 L146 100 Q146 134 100 158 Q54 134 54 100 L54 54 Z"
        fill="none" stroke="url(#accent)" stroke-width="3" filter="url(#soft)"/>
  <path d="M100 38 L146 54 L146 100 Q146 134 100 158 Q54 134 54 100 L54 54 Z"
        fill="url(#accent)" fill-opacity="0.08"/>

  <!-- keyhole: authenticated access -->
  <circle cx="100" cy="96" r="13" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5"/>
  <rect x="96.5" y="96" width="7" height="26" rx="3.5" fill="url(#gold)"/>

  <!-- typed contract ring -->
  <circle cx="100" cy="100" r="58" fill="none" stroke="url(#gold)" stroke-width="1.5"
          stroke-dasharray="3 5" opacity="0.5"/>
  <circle cx="100" cy="100" r="62" fill="none" stroke="url(#accent)" stroke-width="1"
          stroke-dasharray="1 6" opacity="0.35"/>

  <!-- wordmark -->
  <text x="100" y="184" text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="13" font-weight="700" letter-spacing="3"
        fill="#e2e8f0">INNOLOGY</text>
</svg>