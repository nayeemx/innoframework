[workspace]
resolver = "2"
members = ["crates/core", "crates/rpc", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
hmac = "0.12"
sha2 = "0.10"
subtle = "2.5"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = "0.4"
http-body-util = "0.1"
