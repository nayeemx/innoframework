[workspace]
resolver = "2"
members = ["crates/core", "crates/rpc", "crates/rpc-macro", "crates/cli", "crates/ui", "crates/storage-local", "crates/agent", "crates/storage-sqlite", "crates/storage-postgres", "crates/docs-gen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
hmac = "0.12"
sha2 = "0.10"
subtle = "2.5"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tower = "0.4"
http-body-util = "0.1"
http = "1"
clap = { version = "4", features = ["derive"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "signals"] }
dioxus-ssr = "0.7"
walkdir = "2"
