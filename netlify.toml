# Netlify static site configuration for Innoframework product docs (ADR-08)
[build]
  publish = "docs/site"
  command = "echo 'static site: no build step'"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Docs page redirects (clean URLs)
[[redirects]]
  from = "/docs"
  to = "/docs.html"
  status = 200

[[redirects]]
  from = "/docs/"
  to = "/docs.html"
  status = 200

[[redirects]]
  from = "/docs/getting-started"
  to = "/docs/getting-started.html"
  status = 200

[[redirects]]
  from = "/docs/getting-started/"
  to = "/docs/getting-started.html"
  status = 200

[[redirects]]
  from = "/docs/configuration"
  to = "/docs/configuration.html"
  status = 200

[[redirects]]
  from = "/docs/configuration/"
  to = "/docs/configuration.html"
  status = 200

[[redirects]]
  from = "/docs/cli-reference"
  to = "/docs/cli-reference.html"
  status = 200

[[redirects]]
  from = "/docs/cli-reference/"
  to = "/docs/cli-reference.html"
  status = 200

[[redirects]]
  from = "/docs/components"
  to = "/docs/components.html"
  status = 200

[[redirects]]
  from = "/docs/components/"
  to = "/docs/components.html"
  status = 200

[[redirects]]
  from = "/docs/security"
  to = "/docs/security.html"
  status = 200

[[redirects]]
  from = "/docs/security/"
  to = "/docs/security.html"
  status = 200

[[redirects]]
  from = "/docs/architecture"
  to = "/docs/architecture.html"
  status = 200

[[redirects]]
  from = "/docs/architecture/"
  to = "/docs/architecture.html"
  status = 200

[[redirects]]
  from = "/docs/showcases"
  to = "/docs/showcases.html"
  status = 200

[[redirects]]
  from = "/docs/showcases/"
  to = "/docs/showcases.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
